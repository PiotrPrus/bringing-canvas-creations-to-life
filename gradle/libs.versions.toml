[versions]
kotlin = "2.3.21"
compose-multiplatform = "1.11.0"
compose-material3 = "1.11.0-alpha07"
composemediaplayer = "0.11.4"
particle-emitter = "1.1.0"
qrose = "1.0.1"
graphics-shapes = "1.1.0"

[libraries]
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
composemediaplayer = { module = "io.github.kdroidfilter:composemediaplayer", version.ref = "composemediaplayer" }

particle-emitter = { module = "io.github.piotrprus:particle-emitter", version.ref = "particle-emitter" }
qrose = { module = "io.github.alexzhirkevich:qrose", version.ref = "qrose" }
graphics-shapes = { module = "androidx.graphics:graphics-shapes", version.ref = "graphics-shapes" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
